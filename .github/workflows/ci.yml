name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: php -l (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check every PHP file
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './_docs/*' \
            -print0 \
          | xargs -0 -n1 -P4 php -l
